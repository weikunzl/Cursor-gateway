# Cursor Gateway — native Python or OrbStack/Docker
#
# Native:
#   ./scripts/cursor-gateway.sh native start
#
# Docker / OrbStack:
#   ./scripts/cursor-gateway.sh docker up -d --build
#
# See .env.example for both run modes.

services:
  cursor-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cursor-gateway
    ports:
      - "${CURSOR_SERVER_PORT:-8001}:8001"
    env_file:
      - .env
    environment:
      CURSOR_SERVER_HOST: 0.0.0.0
      CURSOR_SERVER_PORT: 8001
      # Container is Linux; mount host Cursor DB explicitly.
      CURSOR_DB_FILE: /cursor-data/state.vscdb
      PROXY_API_KEY: ${PROXY_API_KEY:-my-super-secret-password-123}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      VPN_PROXY_URL: ${VPN_PROXY_URL:-}
    volumes:
      - type: bind
        source: ${HOME}/Library/Application Support/Cursor/User/globalStorage
        target: /cursor-data
        read_only: true
      - ./debug_logs:/app/debug_logs
    extra_hosts:
      # OrbStack: reach host services (e.g. VPN proxy on localhost:7890)
      - host.docker.internal:host-gateway
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import httpx; httpx.get('http://localhost:8001/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  default:
    name: cursor-gateway-network
